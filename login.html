<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dave Social</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--body-bg-login); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-color); }
    header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
    header .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--btn-secondary-text); }
    header a { text-decoration: none; color: var(--btn-secondary-text); font-weight: 600; font-size: 0.95rem; transition: color 0.3s; padding: 0.5rem 1rem; }
    header a:hover { color: #764ba2; }
  </style>
</head>
<body class="auth-page">
  <script>
    if (localStorage.getItem('dashboardTheme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>
    <header>
    <div class="logo">💬 Dave Social</div>
      <a href="index.html">← Back to Home</a>
     </header>
    <div class="login-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; margin-top: -2rem;">
        <div class="login-card" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow); padding: 3rem; width: 100%; max-width: 420px; animation: slideUp 0.6s ease-out;">
            <div class="login-header" style="text-align: center; margin-bottom: 2.5rem;">
                <h1 style="font-size: 1.8rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.5rem;">Welcome Back</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Log in to your account to continue</p>
            </div>
            
                        
                        
            <form class="login-form" method="post" id="loginForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <input type="hidden" name="ajax" value="1">
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="login_input" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Email or Username</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">👤</span>
                        <input type="text" id="login_input" name="login_input" class="form-control" 
                               placeholder="your@email.com or username" required>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="password" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Password</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required
                               style="padding-right: 2.8rem;">
                        <button type="button" class="password-toggle" id="togglePassword" style="position: absolute; right: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer;">👁</button>
                    </div>
                    <a href="/forget-password" style="text-align: right; font-size: 0.9rem; color: #667eea; text-decoration: none; font-weight: 500; margin-top: 0.3rem;">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn8 btn-primary" id="loginBtn8" style="padding: 0.95rem 1.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; margin-top: 1rem;">Log In</button>
                
                <div class="login-footer" style="text-align: center; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>
    <style>
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #login_input:focus, #password:focus, #referral_code:focus {
            outline: none;
            border-color: #667eea !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1) !important;
        }
        #loginBtn8:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        #loginBtn8:active { transform: translateY(0); }
    </style>
 <script>
// ── Toast Notification System ──
class SimpleToast {
    constructor() {
        this.toastContainer = null;
        this.createContainer();
        this.injectStyles();
    }

    createContainer() {
        this.toastContainer = document.createElement('div');
        this.toastContainer.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            font-family: "Poppins", sans-serif;
            display: flex;
            flex-direction: column;
            gap: 10px;
        `;
        document.body.appendChild(this.toastContainer);
    }

    injectStyles() {
        const style = document.createElement('style');
        style.textContent = `
            @keyframes toastSlideIn {
                from { transform: translateX(110%); opacity: 0; }
                to   { transform: translateX(0);    opacity: 1; }
            }
            @keyframes toastSlideOut {
                from { transform: translateX(0);    opacity: 1; }
                to   { transform: translateX(110%); opacity: 0; }
            }
            .toast-close-btn:hover { color: #333 !important; }
        `;
        document.head.appendChild(style);
    }

    show(message, type = 'info', duration = 5000) {
        const configs = {
            success: { icon: '✓', title: 'Success!', color: '#47D764' },
            error:   { icon: '✗', title: 'Error!',   color: '#ff355b' },
            info:    { icon: 'ℹ', title: 'Info!',    color: '#2F86EB' },
            warning: { icon: '⚠', title: 'Warning!', color: '#FFC021' },
        };

        const config = configs[type] || configs.info;
        const toastEl = document.createElement('div');

        toastEl.style.cssText = `
            width: 100%;
            padding: 16px 20px;
            background-color: #fff;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 48px 1fr 28px;
            align-items: center;
            gap: 8px;
            color: #101020;
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
            border-left: 6px solid ${config.color};
            animation: toastSlideIn 0.3s ease-out;
        `;

        toastEl.innerHTML = `
            <div style="text-align:center;">
                <span style="font-size:26px; color:${config.color};">${config.icon}</span>
            </div>
            <div>
                <p style="margin:0 0 4px; font-weight:600; font-size:14px;">${config.title}</p>
                <p style="margin:0; font-size:12px; color:#555;">${message}</p>
            </div>
            <button class="toast-close-btn" style="background:none;border:none;cursor:pointer;font-size:20px;color:#aaa;">×</button>
        `;

        this.toastContainer.appendChild(toastEl);

        const close = () => {
            toastEl.style.animation = 'toastSlideOut 0.3s ease-out forwards';
            toastEl.addEventListener('animationend', () => toastEl.remove(), { once: true });
        };

        toastEl.querySelector('.toast-close-btn').addEventListener('click', close);
        if (duration > 0) setTimeout(close, duration);
    }
}

// ── Initialize Toast ──
const toast = new SimpleToast();

// ── Admin Credentials ──
const ADMIN_EMAIL    = 'admin@primes.com';
const ADMIN_PASSWORD = 'admin123'; // change to your real admin password

// ── DOM Ready ──
document.addEventListener('DOMContentLoaded', () => {

    // ── Password Toggle ──
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput  = document.getElementById('password');

    if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', function () {
            const isHidden     = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            this.textContent   = isHidden ? '🙈' : '👁';
        });
    }

    // ── Login Form Submit ──
    const form      = document.getElementById('loginForm');
    const submitBtn = document.getElementById('loginBtn8');

    if (form && submitBtn) {
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const loginInputValue = document.getElementById('login_input')?.value.trim();
            const passwordValue   = document.getElementById('password')?.value || '';

            // ── Validate empty fields FIRST ──
            if (!loginInputValue || !passwordValue) {
                toast.show('Email/username and password are required.', 'error');
                return;
            }

            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Logging in...';
            submitBtn.disabled = true;

            try {
                // ── API Login Call ──
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: loginInputValue, password: passwordValue })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    const sessionData = {
                        ...result.user,
                        loggedAt: new Date().toISOString()
                    };
                    localStorage.setItem('primes_session', JSON.stringify(sessionData));
                    localStorage.setItem('primes_token', result.token);

                    toast.show('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = result.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
                    }, 1500);
                } else {
                    toast.show(result.error || 'Invalid email/username or password.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                toast.show(error.message || 'Something went wrong. Please try again.', 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled  = false;
            }
        });
    }

    // ── URL Param Messages ──
    const params = new URLSearchParams(window.location.search);

    ['error', 'warning', 'success', 'info'].forEach((type) => {
        const msg = params.get(type);
        if (msg) {
            toast.show(decodeURIComponent(msg), type);
            params.delete(type);
        }
    });

    const cleanUrl =
        window.location.pathname +
        (params.toString() ? '?' + params.toString() : '') +
        window.location.hash;

    window.history.replaceState({}, document.title, cleanUrl);
});
</script>
</body>
</html>
