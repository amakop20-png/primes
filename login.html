<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nura SQ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page">
  <script>
    if (localStorage.getItem('dashboardTheme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>

  <!-- Top Navigation Header -->
  <header class="auth-header">
    <div class="logo">
      <a href="index.html"><img src="nuraxq-logo.png" alt="NuraXQ" width="120" height="auto"></a>
    </div>
    <a href="index.html" class="auth-back-link"><i class="ph ph-arrow-left"></i> Back to Home</a>
  </header>

  <!-- Centered Auth Card Container -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card-logo-wrap">
        <a href="index.html"><img src="nuraxq-logo.png" alt="NuraXQ" class="auth-card-logo"></a>
      </div>

      <div class="auth-card-header">
        <h1>Welcome Back</h1>
        <p>Log in to manage your virtual numbers and SMS services</p>
      </div>

      <form class="auth-form" method="post" id="loginForm">
        <input type="hidden" name="ajax" value="1">

        <div class="form-group">
          <label for="login_input">Email or Username</label>
          <div class="input-group">
            <span class="input-icon"><i class="ph ph-user"></i></span>
            <input type="text" id="login_input" name="login_input" class="form-control" 
                   placeholder="name@example.com or username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">
            <span>Password</span>
            <a href="forget-password.html" class="forgot-password-link">Forgot password?</a>
          </label>
          <div class="input-group">
            <span class="input-icon"><i class="ph ph-lock-key"></i></span>
            <input type="password" id="password" name="password" class="form-control" 
                   placeholder="••••••••" required autocomplete="current-password"
                   style="padding-right: 2.85rem;">
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="loginBtn8">
          <span>Log In</span>
          <div id="loginSpinner" class="btn-spinner" style="display:none;"></div>
        </button>

        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Create an Account</a></p>
        </div>
      </form>
    </div>
  </main>

  <script src="api.js?v=2.3"></script>
  <script src="login.js?v=2.3"></script>
</body>
</html>
