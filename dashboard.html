<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance Dashboard</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Screen Loader -->


  <!-- Aside -->
  <aside id="aside">
    <div class="top">
      <a href="#">
        <span>
          <i class="fa-solid fa-gauge-high"></i>
          Dashboard
        </span>
      </a>
      <a href="#">
        <span>
          <i class="fa-solid fa-wallet"></i>
          Wallet
        </span>
      </a>
      <a href="#">
        <span>
          <i class="fa-solid fa-chart-line"></i>
          Activity
        </span>
      </a>
      <a href="#">
        <span>
          <i class="fa-solid fa-gear"></i>
          Settings
        </span>
      </a>
      <div class="close" id="close-btn">
        <span class="material-icons">
          <i class="fa-solid fa-xmark"></i>
        </span>
      </div>
    </div>

    <div class="mode-tag" onclick="toggleDark()">
      <div class="mode-dot">
        <i class="fa-solid fa-moon"></i>
      </div>
      <span id="modeText">Light mode</span>
    </div>
  </aside>

  <!-- Main -->
  <main class="container">

    <h1>Dashboard</h1>
    <p>Manage your wallet and account activities.</p>

    <!-- Activities -->
    <section class="activities">

      <div class="activities-card">

        <h3>Total Balance</h3>
        <p>$5,420.00</p>

        <div class="bid">

          <button class="btn21" id="openPopup">
            View Details
          </button>

          <button class="btn12">
            Add Funds
          </button>

        </div>

      </div>

    </section>

  </main>

  <!-- Popup -->
  <div id="popup_balance">

    <div class="flex">

      <div class="panel">

        <!-- Header -->
        <div class="panel-header">
          Wallet Overview

          <button class="panel-close" id="closePopup">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Balance Row -->
        <div class="balance-row">

          <div class="balance-left">

            <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" alt="wallet">

            <div>
              <div class="stat-label">Current Balance</div>
              <div class="balance-amount">$5,420</div>
            </div>

          </div>

          <button class="btn-add">
            <i class="fa-solid fa-plus"></i>
          </button>

        </div>

        <!-- Stats -->
        <div class="stat-row">

          <div class="stat-icon info">
            <i class="fa-solid fa-cart-shopping"></i>
          </div>

          <div>
            <div class="stat-label">Numbers Purchased</div>
            <span class="stat-value">124</span>
          </div>

        </div>

        <div class="stat-row">

          <div class="stat-icon secondary">
            <i class="fa-solid fa-wallet"></i>
          </div>

          <div>
            <div class="stat-label">Total Recharge</div>
            <span class="stat-value">$12,500</span>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Scroll Top -->
  <button class="scroll-top" id="scrollTopBtn">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
