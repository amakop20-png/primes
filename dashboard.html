          </div>
        <script>
          document.addEventListener('DOMContentLoaded', () => {

            // ═════════════════════════════
            // DARK MODE
            // ═════════════════════════════

            const saved = localStorage.getItem('theme') || 'light';
            applyTheme(saved);

            function toggleDark() {
              const current = document.documentElement.getAttribute('data-theme') || 'light';
              const next = current === 'dark' ? 'light' : 'dark';
              applyTheme(next);
              localStorage.setItem('theme', next);
            }

            function applyTheme(theme) {
              const isDark = theme === 'dark';
              const modeText = document.getElementById('modeText');
              const modeImg = document.querySelector('.mode-dot img');

              document.documentElement.setAttribute('data-theme', theme);

              if (modeText) {
                modeText.textContent = isDark ? 'Dark mode' : 'Light mode';
              }

              if (modeImg) {
                modeImg.src = isDark
                  ? 'light_mode_24dp_1F1F1F.png'
                  : 'dark_mode_24dp_1F1F1F (1).png';

                modeImg.alt = isDark
                  ? 'Switch to light mode'
                  : 'Switch to dark mode';
              }
            }

            // Make function global
            window.toggleDark = toggleDark;

            // ═════════════════════════════
            // MENU TOGGLE
            // ═════════════════════════════

            const menuToggle = document.getElementById('menu-toggle');
            const aside = document.getElementById('aside');
            const closeBtn = document.getElementById('close-btn');
            const container = document.querySelector('.container');

            // Toggle menu button
            if (menuToggle && aside) {
              menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                menuToggle.classList.toggle('active');
                aside.classList.toggle('open');

                // Update container class for grid layout
                if (container) {
                  container.classList.toggle('has-sidebar');
                }
              });
            }

            // Close button in sidebar
            if (closeBtn && aside && menuToggle) {
              closeBtn.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                aside.classList.remove('open');

                // Update container class for grid layout
                if (container) {
                  container.classList.remove('has-sidebar');
                }
              });
            }

            // Close menu when clicking on a nav link
            if (aside && menuToggle) {
              const navLinks = document.querySelectorAll('aside a');
              navLinks.forEach(link => {
                link.addEventListener('click', () => {
                  menuToggle.classList.remove('active');
                  aside.classList.remove('open');

                  // Update container class for grid layout
                  if (container) {
                    container.classList.remove('has-sidebar');
                  }
                });
              });
            }

            // Close menu when clicking outside
            if (aside && menuToggle) {
              document.addEventListener('click', (e) => {
                if (!aside.contains(e.target) && !menuToggle.contains(e.target)) {
                  if (aside.classList.contains('open')) {
                    menuToggle.classList.remove('active');
                    aside.classList.remove('open');

                    // Update container class for grid layout
                    if (container) {
                      container.classList.remove('has-sidebar');
                    }
                  }
                }
              });
            }

          });
        </script>
</body>
