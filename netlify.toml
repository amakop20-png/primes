[build]
  command = "npm install"
  publish = "."

[functions]
  node_bundler = "esbuild"
  included_files = ["primes/**", "fivesim.js"]
  external_node_modules = ["pg", "bcrypt", "jsonwebtoken", "axios", "cors", "express", "sqlite3"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
