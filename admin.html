<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Admin Panel</title>
</head>

<body>
    <div class="container">
        <aside>
            <div class="top">
                <div class="logo">
                    <img src="" alt="Daves Social">
                </div>
            </div>
            <div class="sidebar">

                <nav>
                    <ul>
                        <li><a href="#">Dashboard</a></li>
                        <li><a href="https://www.facebook.com/profile.php?id=61573212606636">Messages

                                <span class="badge" id="badge">0</span>
                            </a>
                        </li>
                        <li><a href="#">Users</a></li>
                        <li><a href="#">Settings</a></li>
                        <li><a href="#">Logout</a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <main>
            <h1>Admin Dashboard</h1>
            <input type="date" id="datePicker">
            <div class="stats">
                <div class="stat">
                    <h2>Total Users</h2>

                    <div class="description">
                        <p>Total sales</p>
                    </div>
                    <div class="num">
                        <p>1,234</p>
                    </div>
                </div>
                <div class="stat">
                    <h2>Active Users</h2>
                    <p>0</p>
                </div>
                <div class="stat">
                    <h2>New Signups</h2>
                    <p>0</p>
                </div>
            </div>
        </main>
        <div class="right">
            <h2>Recent Activity</h2>
            <ul>
                <li>User John Doe signed up.</li>
                <li>User Jane Smith updated her profile.</li>
                <li>User Mike Johnson deleted his account.</li>
            </ul>
        </div>
    </div>
</body>
<script src="admin.js">

</script>

</html>
