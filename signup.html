<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Dave Social</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--body-bg-login); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-color); }
    header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
    header .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--btn-secondary-text); }
    header a { text-decoration: none; color: var(--btn-secondary-text); font-weight: 600; font-size: 0.95rem; transition: color 0.3s; padding: 0.5rem 1rem; }
    header a:hover { color: #764ba2; }
  </style>
</head>
<body class="auth-page">
  <script>
    if (localStorage.getItem('dashboardTheme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>
    <header>
      <div class="logo">💬 Dave Social</div>
      <a href="index.html">← Back to Home</a>
    </header>

    <div class="register-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; margin-top: 1rem; margin-bottom: 2rem;">
        <div class="register-card" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow); padding: 3rem; width: 100%; max-width: 480px; animation: slideUp 0.6s ease-out;">
            <div class="register-header" style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.8rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.5rem;">Create Account</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Join Dave Social to get virtual phone numbers</p>
            </div>
            
            <form id="registerForm" class="register-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="name" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Full Name</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">👤</span>
                        <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="username" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Username</label>
                    <div class="input-group" style="position: relative; display: flex; flex-direction: column;">
                        <div style="position: relative; display: flex; align-items: center;">
                            <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">@</span>
                            <input type="text" id="username" name="username" class="form-control" placeholder="johndoe" required>
                        </div>
                        <div id="username-error" class="error-message" style="color: #ff355b; font-size: 0.85rem; margin-top: 0.25rem; display: none;"></div>
                        <small style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-top: 0.25rem;">Letters and numbers only</small>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="email" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Email Address</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">✉️</span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="password" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Password</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required style="padding-right: 2.8rem;">
                        <button type="button" class="password-toggle" style="position: absolute; right: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer;">👁️</button>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="confirm_password" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Confirm Password</label>
                    <div class="input-group" style="position: relative; display: flex; flex-direction: column;">
                        <div style="position: relative; display: flex; align-items: center; width: 100%;">
                            <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
                            <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required style="padding-right: 2.8rem;">
                            <button type="button" class="password-toggle" style="position: absolute; right: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer;">👁️</button>
                        </div>
                        <div id="password-error" class="error-message" style="color: #ff355b; font-size: 0.85rem; margin-top: 0.25rem; display: none;"></div>
                    </div>
                </div>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="referral_code" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Referral Code (Optional)</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">🎁</span>
                        <input type="text" id="referral_code" name="referral_code" class="form-control" placeholder="e.g. REF-USERNAME" style="text-transform: uppercase;">
                    </div>
                </div>

                <input type="hidden" id="refer_id" name="refer_id" value="">
                <input type="hidden" name="register" value="1">
                
                <div class="remember-me" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
                    <input type="checkbox" id="remember_me" name="remember_me" checked style="width: 18px; height: 18px; cursor: pointer; accent-color: #667eea;">
                    <label for="remember_me" style="color: var(--text-muted); font-size: 0.9rem; cursor: pointer;">Keep me logged in (30 days)</label>
                </div>
                
                <button type="submit" class="btn9 btn9-primary" id="registerBtn" style="padding: 0.95rem 1.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem;">
                    <span class="btn9-text">Create Account</span>
                    <div class="spinner" id="btnSpinner" style="display: none; width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                </button>
                
                <div class="divider" style="text-align: center; color: var(--text-muted); margin: 1.5rem 0; font-size: 0.9rem; display: flex; align-items: center; gap: 1rem;"><span style="flex: 1; height: 1px; background: var(--border-color);"></span>OR<span style="flex: 1; height: 1px; background: var(--border-color);"></span></div>
                
                <div class="social-login" style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem;">
                    <a href="google-register" class="social-btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem; border: 2px solid var(--border-color); border-radius: 10px; text-decoration: none; color: var(--text-color); background: var(--card-bg); font-weight: 600; font-size: 0.9rem; transition: all 0.3s; cursor: pointer;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
                        Google
                    </a>
                </div>
                
                <div class="register-footer" style="text-align: center; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>
    <style>
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #name:focus, #username:focus, #email:focus, #password:focus, #confirm_password:focus, #referral_code:focus {
            outline: none;
            border-color: #667eea !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1) !important;
        }
        #registerBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        #registerBtn:active { transform: translateY(0); }
        .social-btn:hover { border-color: #667eea; background: rgba(102, 126, 234, 0.05); }
    </style>
    <script>
// ==============================
// Toast Notification System
// ==============================
class SimpleToast {
    constructor() {
        this.createContainer();
        this.injectStyles();
    }

    createContainer() {
        this.toastContainer = document.createElement('div');
        this.toastContainer.className = 'toast-container';
        document.body.appendChild(this.toastContainer);
    }

    injectStyles() {
        if (document.getElementById('toast-styles')) return;

        const style = document.createElement('style');
        style.id = 'toast-styles';

        style.textContent = `
            .toast-container {
                position: fixed;
                top: 20px;
                right: 20px;
                width: 380px;
                max-width: calc(100vw - 30px);
                max-height: 80vh;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
                z-index: 9999;
                font-family: "Poppins", sans-serif;
            }

            .toast {
                display: grid;
                grid-template-columns: 50px 1fr 30px;
                align-items: center;
                gap: 12px;
                padding: 16px;
                background: #ffffff;
                border-radius: 12px;
                border-left: 5px solid;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
                animation: toastSlideIn 0.35s ease;
            }

            .toast-icon {
                font-size: 28px;
                text-align: center;
            }

            .toast-title {
                margin: 0 0 4px;
                font-size: 15px;
                font-weight: 600;
                color: #111827;
            }

            .toast-message {
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                color: #6b7280;
            }

            .toast-close-btn {
                border: none;
                background: transparent;
                font-size: 22px;
                cursor: pointer;
                color: #9ca3af;
                transition: 0.2s ease;
            }

            .toast-close-btn:hover {
                color: #111827;
                transform: scale(1.1);
            }

            @keyframes toastSlideIn {
                from {
                    transform: translateX(120%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes toastSlideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(120%);
                    opacity: 0;
                }
            }

            @media (max-width: 480px) {
                .toast-container {
                    left: 15px;
                    right: 15px;
                    width: auto;
                }
            }
        `;

        document.head.appendChild(style);
    }

    show(message, type = 'info', duration = 5000) {
        const configs = {
            success: {
                icon: '✓',
                title: 'Success',
                color: '#22c55e'
            },
            error: {
                icon: '✕',
                title: 'Error',
                color: '#ef4444'
            },
            warning: {
                icon: '⚠',
                title: 'Warning',
                color: '#f59e0b'
            },
            info: {
                icon: 'ℹ',
                title: 'Info',
                color: '#3b82f6'
            }
        };

        const config = configs[type] || configs.info;

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderColor = config.color;

        toast.innerHTML = `
            <div class="toast-icon" style="color:${config.color}">
                ${config.icon}
            </div>

            <div>
                <p class="toast-title">${config.title}</p>
                <p class="toast-message">${message}</p>
            </div>

            <button class="toast-close-btn">&times;</button>
        `;

        this.toastContainer.appendChild(toast);

        const closeToast = () => {
            toast.style.animation = 'toastSlideOut 0.3s forwards';

            setTimeout(() => {
                toast.remove();
            }, 300);
        };

        toast.querySelector('.toast-close-btn')
            .addEventListener('click', closeToast);

        if (duration > 0) {
            setTimeout(closeToast, duration);
        }
    }
}

const toast = new SimpleToast();

// ==============================
// Validators
// ==============================
const Validator = {
    username(value) {
        return /^[a-zA-Z0-9]+$/.test(value);
    },

    email(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    },

    password(password, confirmPassword) {
        if (password.length < 6) {
            return 'Password must be at least 6 characters';
        }

        if (password !== confirmPassword) {
            return 'Passwords do not match';
        }

        return '';
    }
};

// ==============================
// Utilities
// ==============================
function toggleButton(button, spinner, loading) {
    if (!button || !spinner) return;

    button.disabled = loading;
    button.style.opacity = loading ? '0.7' : '1';
    spinner.style.display = loading ? 'inline-block' : 'none';
}

function generateTransactionId() {
    return `TX-${Math.random().toString(36).slice(2, 11).toUpperCase()}`;
}

// ==============================
// Password Toggle
// ==============================
function initPasswordToggle() {
    const toggles = document.querySelectorAll('.password-toggle');

    toggles.forEach(toggle => {
        toggle.addEventListener('click', () => {
            const input = toggle.parentElement.querySelector('input');

            if (!input) return;

            const isPassword = input.type === 'password';

            input.type = isPassword ? 'text' : 'password';
            toggle.textContent = isPassword ? '🙈' : '👁️';
        });
    });
}

// ==============================
// Live Validation
// ==============================
function initLiveValidation() {
    const usernameInput = document.getElementById('username');
    const usernameError = document.getElementById('username-error');

    usernameInput?.addEventListener('input', (e) => {
        const cleaned = e.target.value.replace(/[^a-zA-Z0-9]/g, '');

        if (e.target.value !== cleaned) {
            e.target.value = cleaned;

            if (usernameError) {
                usernameError.textContent = 'Only letters and numbers allowed';
                usernameError.classList.add('show');
            }
        } else {
            usernameError?.classList.remove('show');
        }
    });

    const confirmInput = document.getElementById('confirm_password');
    const passwordError = document.getElementById('password-error');

    confirmInput?.addEventListener('input', () => {
        const password =
            document.getElementById('password')?.value || '';

        const error = Validator.password(
            password,
            confirmInput.value
        );

        if (error) {
            passwordError.textContent = error;
            passwordError.classList.add('show');
        } else {
            passwordError?.classList.remove('show');
        }
    });
}

// ==============================
// Local Storage
// ==============================
function getUsers() {
    return JSON.parse(
        localStorage.getItem('primes_users') || '[]'
    );
}

function saveUsers(users) {
    localStorage.setItem(
        'primes_users',
        JSON.stringify(users)
    );
}

function saveActivity(entry) {
    const activities = JSON.parse(
        localStorage.getItem('primes_activity') || '[]'
    );

    activities.unshift(entry);

    localStorage.setItem(
        'primes_activity',
        JSON.stringify(activities.slice(0, 100))
    );
}

// ==============================
// Registration Form
// ==============================
function initForm() {
    const form = document.getElementById('registerForm');

    if (!form) return;

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const name =
            document.getElementById('name')?.value.trim();

        const username =
            document.getElementById('username')?.value.trim();

        const email =
            document.getElementById('email')
                ?.value.trim()
                .toLowerCase();

        const password =
            document.getElementById('password')?.value || '';

        const confirmPassword =
            document.getElementById('confirm_password')?.value || '';

        const referralCode =
            document.getElementById('referral_code')
                ?.value.trim()
                .toUpperCase();

        const rememberMe =
            document.getElementById('remember_me')
                ?.checked || false;

        const button =
            document.getElementById('registerBtn');

        const spinner =
            document.getElementById('btnSpinner');

        // Validation
        if (!name) {
            return toast.show(
                'Full name is required',
                'error'
            );
        }

        if (!Validator.username(username)) {
            return toast.show(
                'Username must contain only letters and numbers',
                'error'
            );
        }

        if (!Validator.email(email)) {
            return toast.show(
                'Please enter a valid email address',
                'error'
            );
        }

        const passwordError = Validator.password(
            password,
            confirmPassword
        );

        if (passwordError) {
            return toast.show(passwordError, 'error');
        }

        const users = getUsers();

        const usernameExists = users.some(
            user =>
                user.username.toLowerCase() ===
                username.toLowerCase()
        );

        if (usernameExists) {
            return toast.show(
                'Username already exists',
                'error'
            );
        }

        const emailExists = users.some(
            user => user.email === email
        );

        if (emailExists) {
            return toast.show(
                'Email already exists',
                'error'
            );
        }

        // Referral
        let referredBy = null;

        if (referralCode) {
            referredBy = referralCode.replace(
                'REF-',
                ''
            ).toLowerCase();

            if (
                referredBy === username.toLowerCase()
            ) {
                return toast.show(
                    'You cannot refer yourself',
                    'error'
                );
            }

            const referrer = users.find(
                user =>
                    user.username.toLowerCase() ===
                    referredBy
            );

            if (!referrer) {
                return toast.show(
                    'Invalid referral code',
                    'error'
                );
            }
        }

        toggleButton(button, spinner, true);

        setTimeout(() => {
            const newUser = {
                name,
                username,
                email,
                password,
                rememberMe,
                balance: 0,
                referralBalance: 0,
                referralCount: 0,
                referrals: [],
                transactions: [],
                numbersPurchased: 0,
                totalRecharge: 0,
                createdAt: new Date().toISOString()
            };

            // Reward referrer
            if (referredBy) {
                const referrer = users.find(
                    user =>
                        user.username.toLowerCase() ===
                        referredBy
                );

                if (referrer) {
                    referrer.balance =
                        (referrer.balance || 0) + 0.5;

                    referrer.referralBalance =
                        (referrer.referralBalance || 0) + 0.5;

                    referrer.referralCount =
                        (referrer.referralCount || 0) + 1;

                    referrer.referrals =
                        referrer.referrals || [];

                    referrer.transactions =
                        referrer.transactions || [];

                    referrer.referrals.push(username);

                    referrer.transactions.unshift({
                        id: generateTransactionId(),
                        type: 'Referral Reward',
                        amount: 0.5,
                        description: `Referred ${name} (@${username})`,
                        timestamp: new Date().toISOString()
                    });

                    newUser.referredBy =
                        referrer.username;
                }
            }

            users.push(newUser);

            saveUsers(users);

            saveActivity({
                type: 'signup',
                username,
                message: `${name} (${username}) created a new account`,
                timestamp: new Date().toISOString()
            });

            toast.show(
                'Account created successfully!',
                'success'
            );

            toggleButton(button, spinner, false);

            setTimeout(() => {
                window.location.href =
                    'login.html?success=' +
                    encodeURIComponent(
                        'Account created successfully. Please log in.'
                    );
            }, 1200);

        }, 1000);
    });
}

// ==============================
// Init App
// ==============================
document.addEventListener('DOMContentLoaded', () => {
    initPasswordToggle();
    initLiveValidation();
    initForm();
});
</script>
</body>
</html>
