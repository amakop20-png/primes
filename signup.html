<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Dave Social</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--body-bg-login); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-color); }
    header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
    header .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--btn-secondary-text); }
    header a { text-decoration: none; color: var(--btn-secondary-text); font-weight: 600; font-size: 0.95rem; transition: color 0.3s; padding: 0.5rem 1rem; }
    header a:hover { color: #764ba2; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes toastSlideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toastSlideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
    .toast-container { position: fixed; top: 20px; right: 20px; width: 380px; max-width: calc(100vw - 30px); z-index: 9999; }
    .toast { display: grid; grid-template-columns: 50px 1fr 30px; align-items: center; gap: 12px; padding: 16px; background: #fff; border-radius: 12px; border-left: 5px solid; box-shadow: 0 8px 25px rgba(0,0,0,0.08); animation: toastSlideIn 0.35s ease; margin-bottom: 12px; }
    .toast-icon { font-size: 24px; text-align: center; }
    .toast-title { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: #111827; }
    .toast-message { margin: 0; font-size: 13px; line-height: 1.5; color: #6b7280; }
    .toast-close-btn { border: none; background: 0; font-size: 20px; cursor: pointer; color: #9ca3af; }
    .form-control { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--input-bg); color: var(--text-color); font-family: inherit; font-size: 0.95rem; transition: all 0.2s; }
    .form-control:focus { outline: 0; border-color: #667eea !important; box-shadow: 0 0 0 3px rgba(102,126,234,0.1) !important; }
  </style>
</head>
<body class="auth-page">
  <script>
    if (localStorage.getItem('dashboardTheme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>
  <header>
    <div class="logo">💬 Dave Social</div>
    <a href="index.html">← Back to Home</a>
  </header>
  <div class="register-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; margin-top: 1rem; margin-bottom: 2rem;">
    <div class="register-card" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow); padding: 3rem; width: 100%; max-width: 480px; animation: slideUp 0.6s ease-out;">
      <div class="register-header" style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.8rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.5rem;">Create Account</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Join Dave Social to get virtual phone numbers</p>
      </div>
      <form id="registerForm" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div style="display: flex; gap: 1rem;">
          <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
            <label for="firstName" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">First Name</label>
            <div style="position: relative; display: flex; align-items: center;">
              <span style="position: absolute; left: 1rem; font-size: 1.2rem;">👤</span>
              <input type="text" id="firstName" name="firstName" class="form-control" placeholder="John" required style="padding-left: 2.8rem;">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
            <label for="lastName" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Last Name</label>
            <div style="position: relative; display: flex; align-items: center;">
              <span style="position: absolute; left: 1rem; font-size: 1.2rem;">👤</span>
              <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Doe" required style="padding-left: 2.8rem;">
            </div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="username" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Username</label>
          <div style="position: relative; display: flex; flex-direction: column;">
            <div style="position: relative; display: flex; align-items: center;">
              <span style="position: absolute; left: 1rem; font-size: 1.2rem;">@</span>
              <input type="text" id="username" name="username" class="form-control" placeholder="johndoe" required style="padding-left: 2.8rem;">
            </div>
            <div id="username-error" style="color: #ff355b; font-size: 0.85rem; margin-top: 0.25rem; display: none;"></div>
            <small style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-top: 0.25rem;">Letters and numbers only</small>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="email" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Email Address</label>
          <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 1rem; font-size: 1.2rem;">✉️</span>
            <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required style="padding-left: 2.8rem;">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="phoneNumber" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Phone Number</label>
          <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 1rem; font-size: 1.2rem;">📱</span>
            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" placeholder="+234 800 000 0000" required style="padding-left: 2.8rem;">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="password" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required style="padding-left: 2.8rem; padding-right: 2.8rem;">
            <button type="button" class="password-toggle" style="position: absolute; right: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer;">👁️</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="confirm_password" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Confirm Password</label>
          <div style="position: relative; display: flex; flex-direction: column;">
            <div style="position: relative; display: flex; align-items: center; width: 100%;">
              <span style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
              <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required style="padding-left: 2.8rem; padding-right: 2.8rem;">
              <button type="button" class="password-toggle" style="position: absolute; right: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer;">👁️</button>
            </div>
            <div id="password-error" style="color: #ff355b; font-size: 0.85rem; margin-top: 0.25rem; display: none;"></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label for="referral_code" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Referral Code (Optional)</label>
          <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 1rem; font-size: 1.2rem;">🎁</span>
            <input type="text" id="referral_code" name="referral_code" class="form-control" placeholder="e.g. REF-USERNAME" style="padding-left: 2.8rem; text-transform: uppercase;">
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
          <input type="checkbox" id="accept_terms" name="accept_terms" required style="width: 18px; height: 18px; cursor: pointer; accent-color: #667eea;">
          <label for="accept_terms" style="color: var(--text-muted); font-size: 0.9rem; cursor: pointer;">I agree to the <a href="terms.html" style="color: #667eea; text-decoration: underline;">Terms & Conditions</a></label>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
          <input type="checkbox" id="remember_me" name="remember_me" checked style="width: 18px; height: 18px; cursor: pointer; accent-color: #667eea;">
          <label for="remember_me" style="color: var(--text-muted); font-size: 0.9rem; cursor: pointer;">Keep me logged in (30 days)</label>
        </div>
        <button type="submit" id="registerBtn" style="padding: 0.95rem 1.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem;">
          <span>Create Account</span>
          <div id="btnSpinner" style="display: none; width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </button>
        <div style="text-align: center; padding-top: 1rem; border-top: 1px solid var(--border-color);">
          <p style="color: var(--text-muted); font-size: 0.95rem;">Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a></p>
        </div>
      </form>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="signup.js"></script>
</body>
</html>
