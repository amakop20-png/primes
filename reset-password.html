<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password - Dave Social</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--body-bg-login); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-color); }
    header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
    header .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--btn-secondary-text); }
    header a { text-decoration: none; color: var(--btn-secondary-text); font-weight: 600; font-size: 0.95rem; transition: color 0.3s; padding: 0.5rem 1rem; }
    header a:hover { color: #667eea; }
    
    @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    input:focus {
        outline: none;
        border-color: #667eea !important;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1) !important;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body class="auth-page">
  <script>
    if (localStorage.getItem('dashboardTheme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>
    <header>
      <div class="logo">💬 Dave Social</div>
      <a href="login.html">← Back to Login</a>
    </header>
    <div class="login-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; margin-top: -2rem;">
        <div class="login-card" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow); padding: 3rem; width: 100%; max-width: 420px; animation: slideUp 0.6s ease-out;">
            <div class="login-header" style="text-align: center; margin-bottom: 2.5rem;">
                <h1 style="font-size: 1.8rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.5rem;">Create New Password</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Please enter your new password</p>
            </div>
            
            <form id="resetForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="password" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">New Password</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-left: 3rem; width: 100%; padding-top: 0.8rem; padding-bottom: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="confirmPassword" style="font-weight: 600; color: var(--text-color); font-size: 0.9rem;">Confirm Password</label>
                    <div class="input-group" style="position: relative; display: flex; align-items: center;">
                        <span class="input-icon" style="position: absolute; left: 1rem; font-size: 1.2rem;">🔒</span>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required style="padding-left: 3rem; width: 100%; padding-top: 0.8rem; padding-bottom: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
                    </div>
                </div>
                
                <button type="submit" id="submitBtn" style="padding: 0.95rem 1.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; margin-top: 1rem;">Reset Password</button>
            </form>
        </div>
    </div>

 <script>
class SimpleToast {
    constructor() {
        this.toastContainer = null;
        this.createContainer();
    }
    createContainer() {
        this.toastContainer = document.createElement('div');
        this.toastContainer.style.cssText = `
            position: fixed; top: 20px; right: 20px; z-index: 9999; width: 380px;
            font-family: "Poppins", sans-serif; display: flex; flex-direction: column; gap: 10px;
        `;
        document.body.appendChild(this.toastContainer);
    }
    show(message, type = 'success') {
        const toast = document.createElement('div');
        const colors = { success: '#10B981', error: '#EF4444' };
        toast.style.cssText = `
            background: #fff; color: #333; padding: 16px 20px; border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-left: 4px solid ${colors[type]};
            font-size: 14px; font-weight: 500;
        `;
        toast.textContent = message;
        this.toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }
}
const toast = new SimpleToast();

document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
        return toast.show('Invalid reset link. Token missing.', 'error');
    }

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 6) return toast.show('Password must be at least 6 characters.', 'error');
    if (password !== confirmPassword) return toast.show('Passwords do not match.', 'error');
    
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Resetting...';
    btn.disabled = true;

    try {
        const res = await fetch('http://localhost:3000/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword: password })
        });
        const data = await res.json();
        
        if (data.success) {
            toast.show(data.message, 'success');
            document.getElementById('resetForm').reset();
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        } else {
            toast.show(data.error || 'Failed to reset password.', 'error');
        }
    } catch (err) {
        toast.show('Network error. Please try again.', 'error');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
});
</script>
</body>
</html>
